# Konfiguration des Pflege-Assistenten.
# Diese Datei ist sicherheitsrelevant - bitte nur mit Bedacht ändern.

[server]
# Nur lokal erreichbar. Ohne diese Zeile bindet Streamlit an ALLE
# Netzwerk-Schnittstellen; die hochgeladenen Pflegedokumente wären dann
# für andere Geräte im selben Netzwerk (WLAN, Uni-Netz) abrufbar.
address = "localhost"
port = 8501
headless = true

# Schutz gegen Cross-Site-Request-Forgery und fremde Ursprünge.
enableXsrfProtection = true
enableCORS = true

# Maximale Uploadgröße in MB. Bewusst etwas höher als die Prüfung in der
# Anwendung, damit zu große Dateien eine verständliche Meldung erhalten,
# statt von Streamlit kommentarlos abgewiesen zu werden.
maxUploadSize = 35

[browser]
# WICHTIG (Datenschutz): Streamlit sendet ohne diese Zeile anonyme
# Nutzungsstatistiken an einen externen Dienst. Bei Gesundheits- und
# Pflegedaten ist jeder ausgehende Datenverkehr zu vermeiden.
gatherUsageStats = false

[client]
# Schlanke Werkzeugleiste: blendet den "Deploy"-Knopf aus, der für
# Nutzerinnen und Nutzer dieser Anwendung keine Funktion hat.
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#1B4965"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F4F7"
textColor = "#16202A"
